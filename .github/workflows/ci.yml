name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Une nouvelle exécution sur la même branche annule la précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, format et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Installer uv
        # setup-uv ne publie pas de tag majeur (v10) : on fixe la version complète.
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Installer Python et les dépendances
        # --locked : échoue si uv.lock n'est pas à jour avec pyproject.toml
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest
