name: Bug
description: Un comportement inattendu
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: Ce qui se passe
      description: Message d'erreur, traceback, données incorrectes…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ce qui devrait se passer
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Pour reproduire
      placeholder: |
        1. uv run …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit ou version
      placeholder: "git rev-parse --short HEAD"
